name: Replace repository and build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-consent-project.yml'
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  replace-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct project
        shell: bash
        run: |
          cat .bootstrap/chunk.00 .bootstrap/chunk.01 .bootstrap/chunk.02 .bootstrap/chunk.03 .bootstrap/chunk.04 .bootstrap/chunk.05 .bootstrap/chunk.06 .bootstrap/chunk.07 .bootstrap/chunk.08 .bootstrap/chunk.09 .bootstrap/chunk.10 | base64 -d > /tmp/project.tar.gz
          echo "92a456189cc2fb86676de66c0e0f28923ee46391a2938cf0a63889f981a553e6  /tmp/project.tar.gz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/project.tar.gz -C .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: consent-location-share-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Replace repository contents
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace repository with consent-based location sharing app"
          git push origin main
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy-pages:
    needs: replace-build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
