name: Replace repository and build
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-consent-project.yml'
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  replace-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct project
        shell: bash
        run: |
          cat .bootstrap/payload.part1 .bootstrap/payload.part2 | base64 -d > /tmp/project.tar.gz
          echo "415edb886cdbd5a5a446f02f7a38813f2d5a1dbfc1fb14634fcee56e4a6a0e64  /tmp/project.tar.gz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/project.tar.gz -C .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: consent-location-share-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Replace repository contents
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace repository with consent-based location sharing app"
          git push origin main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy-pages:
    needs: replace-build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
