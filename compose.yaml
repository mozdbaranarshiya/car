services:
  server:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      ADMIN_SETUP_TOKEN: ${ADMIN_SETUP_TOKEN:-}
    volumes:
      - tracker-data:/data
    networks: [tracker]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [server]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [tracker]
volumes:
  tracker-data:
  caddy-data:
  caddy-config:
networks:
  tracker:
